<div>

          </p>
</div>
</div>

<span class="font-headline font-black italic text-5xl text-primary leading-none" id="rating-value">8.0</span>
</div>
<div class="relative w-full h-12 flex items-center">
<input class="w-full h-2 bg-surface-container-highest rounded-lg appearance-none cursor-pointer" max="10" min="1" oninput="document.getElementById('rating-value').innerText = parseFloat(this.value).toFixed(1)" step="0.5" type="range" value="8"/>
</div>
<div class="flex justify-between mt-4 text-[10px] font-headline font-bold text-on-surface-variant uppercase tracking-widest">
<span>Kötü</span>
<span>Ortalama</span>
<span>Efsanevi</span>
</div>
</div>

          Mücadeleci
        </button>
<!-- Negative/Neutral Tags -->
<button class="px-5 py-3 rounded-full bg-surface-container-highest border border-outline-variant/30 text-sm font-headline font-semibold text-on-surface hover:border-error/50 hover:bg-error/5 transition-all duration-300">

<span class="material-symbols-outlined align-middle">double_arrow</span>
