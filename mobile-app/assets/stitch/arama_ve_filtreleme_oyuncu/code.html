<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-gradient {
            background: linear-gradient(135deg, #8eff71 0%, #2ff801 100%);
        }
        .tonal-shift {
            background-color: #131313;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        body {
            min-height: max(884px, 100dvh);

<body class="bg-background text-on-background font-body select-none">
<!-- TopAppBar -->
<header class="bg-[#0e0e0e]/80 backdrop-blur-md fixed top-0 w-full z-50 border-b border-[#484847]/15 shadow-[0_24px_32px_-4px_rgba(255,255,255,0.06)]">
<div class="flex items-center justify-between px-6 h-16 w-full">
<button class="text-[#adaaaa] active:scale-95 duration-200" style="">
<span class="material-symbols-outlined" data-icon="search" style="">search</span>
</button>
<h1 class="text-xl font-black text-[#8eff71] uppercase font-headline tracking-tight" style="">ARAMA</h1>
<div class="w-6"></div>
</div>
</header>
<main class="pt-20 pb-40 px-6 max-w-2xl mx-auto">
<!-- Segmented Control Tabs -->
<section class="mb-10">
<div class="bg-surface-container-highest p-1 flex rounded-xl">
<button class="flex-1 py-3 text-sm font-label font-medium text-on-surface-variant hover:bg-[#262626] transition-colors rounded-xl" style="">Maç</button>
<button class="flex-1 py-3 text-sm font-label font-bold tracking-tight bg-primary text-on-primary rounded-xl transition-all duration-200" style="">Oyuncu</button>
<button class="flex-1 py-3 text-sm font-label font-medium text-on-surface-variant hover:bg-[#262626] transition-colors rounded-xl" style="">Rakip</button>
</div>
</section>
<!-- Hierarchical Location Filters -->
<section class="space-y-4 mb-10">
<h2 class="font-headline text-xs font-bold uppercase tracking-widest text-primary-dim opacity-80 px-1" style="">KONUM FİLTRELERİ</h2>
<!-- City Dropdown -->
<div class="group relative bg-surface-container-low rounded-xl border border-outline-variant/15 hover:border-primary/40 transition-all duration-300">
<div class="p-4 flex items-center justify-between">
<div>
<p class="text-[10px] font-label font-bold text-on-surface-variant uppercase tracking-tighter" style="">Şehir</p>
<p class="text-on-surface font-semibold" style="">İstanbul</p>
</div>
<span class="material-symbols-outlined text-outline" style="">expand_more</span>
</div>
</div>
<!-- District Dropdown -->
<div class="group relative bg-surface-container-low rounded-xl border border-outline-variant/15 hover:border-primary/40 transition-all duration-300">
<div class="p-4 flex items-center justify-between">
<div>
<p class="text-[10px] font-label font-bold text-on-surface-variant uppercase tracking-tighter" style="">İlçe</p>
<p class="text-on-surface font-semibold" style="">Beşiktaş</p>
</div>
<span class="material-symbols-outlined text-outline" style="">expand_more</span>
</div>
</div>
<!-- Field Dropdown -->
<div class="group relative bg-surface-container-low rounded-xl border border-outline-variant/15 hover:border-primary/40 transition-all duration-300">
<div class="p-4 flex items-center justify-between">
<div>
<p class="text-[10px] font-label font-bold text-on-surface-variant uppercase tracking-tighter" style="">Saha</p>
<p class="text-on-surface font-semibold" style="">Powerleague</p>
</div>
<span class="material-symbols-outlined text-outline" style="">expand_more</span>
</div>
</div>
</section>
<!-- Position Requirements -->

<h2 class="font-headline text-xs font-bold uppercase tracking-widest text-primary-dim opacity-80 px-1 mb-4" style="">POZİSYON İHTİYACI</h2>
<div class="grid grid-cols-4 gap-3">
<button class="aspect-square flex flex-col items-center justify-center bg-primary/10 border-2 border-primary rounded-xl transition-all duration-200" style="">
<span class="text-lg font-headline font-black text-primary" style="">KL</span>
<span class="text-[8px] font-bold text-primary uppercase" style="">Kaleci</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center bg-surface-container-highest border border-outline-variant/20 rounded-xl hover:border-primary/40 transition-all duration-200 active:scale-95" style="">
<span class="text-lg font-headline font-black text-on-surface" style="">DF</span>
<span class="text-[8px] font-bold text-on-surface-variant uppercase" style="">Defans</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center bg-surface-container-highest border border-outline-variant/20 rounded-xl hover:border-primary/40 transition-all duration-200 active:scale-95" style="">
<span class="text-lg font-headline font-black text-on-surface" style="">OS</span>
<span class="text-[8px] font-bold text-on-surface-variant uppercase" style="">Orta Saha</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center bg-surface-container-highest border border-outline-variant/20 rounded-xl hover:border-primary/40 transition-all duration-200 active:scale-95" style="">
<span class="text-lg font-headline font-black text-on-surface" style="">FV</span>
<span class="text-[8px] font-bold text-on-surface-variant uppercase" style="">Forvet</span>
</button>
</div>
</section>
<!-- Player Level Section -->
<section class="mb-10">
<h2 class="font-headline text-xs font-bold uppercase tracking-widest text-primary-dim opacity-80 px-1 mb-4" style="">OYUNCU SEVİYESİ</h2>
<div class="grid grid-cols-2 gap-3">
<button class="py-4 flex items-center justify-center bg-primary/10 border-2 border-primary rounded-xl transition-all duration-200" style="">
<span class="text-sm font-headline font-bold text-primary uppercase" style="">-3.9</span>
</button>
<button class="py-4 flex items-center justify-center bg-surface-container-highest border border-outline-variant/20 rounded-xl hover:border-primary/40 transition-all duration-200 active:scale-95" style="">
<span class="text-sm font-headline font-bold text-on-surface uppercase" style="">4.0-5.9<br></span>
</button>
<button class="py-4 flex items-center justify-center bg-surface-container-highest border border-outline-variant/20 rounded-xl hover:border-primary/40 transition-all duration-200 active:scale-95" style="">
<span class="text-sm font-headline font-bold text-on-surface uppercase" style="">6.0-7.9</span>
</button>
<button class="py-4 flex items-center justify-center bg-surface-container-highest border border-outline-variant/20 rounded-xl hover:border-primary/40 transition-all duration-200 active:scale-95" style="">
<span class="text-sm font-headline font-bold text-on-surface uppercase" style="">8.0+</span>
</button>
</div>
</section>
<!-- Settings Toggle Section -->
<section class="mb-12">
<div class="bg-surface-container p-5 rounded-xl flex items-center justify-between">
<div>
<h3 class="font-headline text-sm font-bold text-on-surface uppercase" style="">Ayarları Kaydet</h3>
<p class="text-xs text-on-surface-variant font-medium" style="">Beni Hatırla</p>
</div>
<!-- Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer" style="">
<input checked="" class="sr-only peer" type="checkbox">
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</section>
<!-- Primary Action Button -->
<div class="fixed bottom-24 left-0 w-full px-6">
<button class="w-full kinetic-gradient py-5 rounded-xl text-on-primary font-headline font-black text-lg tracking-widest shadow-[0_8px_32px_-4px_rgba(142,255,113,0.4)] active:scale-95 transition-transform" style="">
            ARAMAYI BAŞLAT
        </button>
</div>

<span class="material-symbols-outlined" data-icon="home" style="">home</span>
<span class="font-['Lexend'] text-[10px] font-medium uppercase tracking-widest mt-1" style="">Ana Sayfa</span>

<button class="flex flex-col items-center justify-center text-[#8eff71] bg-[#262626] rounded-xl py-1 px-3 transition-all active:scale-90 duration-150" style="">
<span class="material-symbols-outlined" data-icon="search" style="font-variation-settings: &quot;FILL&quot; 1;">search</span>
<span class="font-['Lexend'] text-[10px] font-medium uppercase tracking-widest mt-1" style="">Arama</span>
</button>
<button class="flex flex-col items-center justify-center text-[#adaaaa] py-1 px-3 hover:text-[#8eff71] transition-all active:scale-90 duration-150" style="">
<span class="material-symbols-outlined" data-icon="sports_soccer" style="">sports_soccer</span>
<span class="font-['Lexend'] text-[10px] font-medium uppercase tracking-widest mt-1" style="">Maçlarım</span>
</button>
<button class="flex flex-col items-center justify-center text-[#adaaaa] py-1 px-3 hover:text-[#8eff71] transition-all active:scale-90 duration-150" style="">
<span class="material-symbols-outlined" data-icon="groups" style="">groups</span>
<span class="font-['Lexend'] text-[10px] font-medium uppercase tracking-widest mt-1" style="">Kulüp</span>
</button>
<button class="flex flex-col items-center justify-center text-[#adaaaa] py-1 px-3 hover:text-[#8eff71] transition-all active:scale-90 duration-150" style="">
<span class="material-symbols-outlined" data-icon="person" style="">person</span>
<span class="font-['Lexend'] text-[10px] font-medium uppercase tracking-widest mt-1" style="">Profil</span>
